<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的个人博客</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; }
        img { max-width: 100%; margin: 20px 0; border: 1px solid #ccc; }
        .note { background: #f0f0f0; padding: 10px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>欢迎来到 jiuwanl 的博客</h1>
    <p>这是利用 GitHub Pages 发布的个人博客。</p>

    <h2>图片示例</h2>

    <!-- 1. 绝对路径图片（从网络加载） -->
    <p><strong>绝对路径图片：</strong>（来自网络）</p>
    <img src="https://picsum.photos/id/1/400/300" alt="绝对路径图片">

    <!-- 2. 相对路径图片（需要下一步上传本地图片到 images/ 文件夹） -->
    <p><strong>相对路径图片：</strong>（来自仓库内的 images/book.jpg）</p>
    <img src="images/book.jpg" alt="相对路径图片">

    <div class="note">
        <h3>路径说明</h3>
        <p>绝对路径：<code>https://picsum.photos/id/1/400/300</code></p>
        <p>相对路径：<code>images/book.jpg</code></p>
    </div>
</body>
</html>
